name: Python-R Interoperability
on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  interop-tests:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install Python Dependencies
        run: pip install h5py hdf5plugin numpy

      - name: Generate Interop Test File (Python -> C)
        working-directory: tests/interop
        run: python generate_python_zoo.py

      - name: Build and Install hdf5lib
        run: |
          R CMD build .
          R CMD INSTALL hdf5lib_*.tar.gz

      - name: Run R/C Interop Scripts
        working-directory: tests/interop
        # This R script should now compile and run both:
        # 1. verify_python_zoo.c
        # 2. generate_c_zoo.c
        run: Rscript run_interop_tests.r

      - name: Run Read Verification (C -> Python)
        working-directory: tests/interop
        run: python verify_c_zoo.py
