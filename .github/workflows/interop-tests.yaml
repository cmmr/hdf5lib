name: Interoperability Tests

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  interop-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy h5py hdf5plugin

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: Install R Dependencies
        run: install.packages("Rcpp")
        shell: Rscript {0}

      - name: Build and Install hdf5lib
        run: R CMD INSTALL .

      - name: Step 1 - Python Writes HDF5 (28 Filter Combinations)
        run: python tests/interop/write_python_hdf5.py

      - name: Step 2 - R/hdf5lib Reads and Rewrites HDF5 (Filter Swapping)
        run: Rscript tests/interop/read_write_r_hdf5.r

      - name: Step 3 - Python Verifies Rewritten HDF5
        run: python tests/interop/verify_python_hdf5.py
